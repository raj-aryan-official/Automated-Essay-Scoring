# WHY: Production Nginx reverse proxy serving static React SPA assets and routing /api/ calls directly to the FastAPI service container.
server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # WHY: Gzip compression reduces transfer payload sizes across text, JSON, CSS, and JavaScript bundles.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # WHY: Reverse proxy forwards all /api/ requests directly to the backend container, bypassing CORS and simplifying client networking.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WHY: Applies aggressive 1-year cache headers to immutable hashed JavaScript and CSS assets produced by Vite build.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # WHY: Single Page Application fallback routes unknown paths to index.html so React Router handles client navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WHY: Lightweight 200 OK health check endpoint for Docker Compose and container orchestrators without generating log clutter.
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
