[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
]
ignore = [
    "E402",   # module import not at top of file (sys.path manipulation in scripts/workers)
    "E501",   # line length violations (delegated to Black)
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends / Query)
    "B010",   # setattr with constant attribute value (used for ORM model attribute assignment)
    "B009",   # getattr with constant attribute value
    "UP017",  # datetime.timezone.utc -> datetime.UTC (preserve backward compatibility)
    "UP042",  # class X(str, Enum) -> StrEnum (preserve backward compatibility)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"backend/tests/*" = ["F401", "F841"]
"inference/tests/*" = ["F401", "F841"]
