version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: aes_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aes_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aes_password}
      POSTGRES_DB: ${POSTGRES_DB:-aes_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/schema.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aes_user} -d ${POSTGRES_DB:-aes_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: aes_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: aes_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin}; do
        echo 'Waiting for MinIO connection...'
        sleep 1
      done;
      /usr/bin/mc mb --ignore-existing myminio/${S3_BUCKET:-essay-documents};
      /usr/bin/mc anonymous set download myminio/${S3_BUCKET:-essay-documents} || true;
      echo 'Default bucket ready.';
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aes_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aes_user}:${POSTGRES_PASSWORD:-aes_password}@postgres:5432/${POSTGRES_DB:-aes_db}
      DATABASE_SYNC_URL: postgresql://${POSTGRES_USER:-aes_user}:${POSTGRES_PASSWORD:-aes_password}@postgres:5432/${POSTGRES_DB:-aes_db}
      S3_ENDPOINT: http://minio:9000
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-essay-documents}
      S3_BUCKET_NAME: ${S3_BUCKET:-essay-documents}
    ports:
      - "8000:8000"

  inference-worker:
    build:
      context: ./inference
      dockerfile: Dockerfile.gpu
    container_name: aes_inference_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    env_file:
      - .env.example
    environment:
      DATABASE_SYNC_URL: postgresql://${POSTGRES_USER:-aes_user}:${POSTGRES_PASSWORD:-aes_password}@postgres:5432/${POSTGRES_DB:-aes_db}
      S3_ENDPOINT: http://minio:9000
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-essay-documents}
      S3_BUCKET_NAME: ${S3_BUCKET:-essay-documents}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aes_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  minio_data:
